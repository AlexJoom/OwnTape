<!doctype html><meta charset="utf-8"><title>Toolbar States</title><style>
body{margin:0;padding:20px;font:13px/1.4 system-ui,sans-serif;background:#d9d9de;display:grid;gap:14px}
.bar{display:flex;gap:28px;align-items:center;padding:12px 18px;border-radius:10px}
.cell{display:grid;justify-items:center;gap:6px}.row{display:flex;gap:10px;align-items:center}
img.x1{width:16px;height:16px;image-rendering:pixelated}img.x2{width:32px;height:32px}</style>
<div class="bar" style="background:#ffffff;color:#1f1f1f"><b style="width:100px">Light toolbar</b><div class="cell"><div class="row"><img class="x1" src="png/icon-idle-16.png" alt=""><img class="x2" src="png/icon-idle-32.png" alt=""></div>Not a Meet tab</div><div class="cell"><div class="row"><img class="x1" src="png/icon-ready-16.png" alt=""><img class="x2" src="png/icon-ready-32.png" alt=""></div>Meet tab — ready</div><div class="cell"><div class="row"><img class="x1" src="png/icon-recording-16.png" alt=""><img class="x2" src="png/icon-recording-32.png" alt=""></div>Recording</div></div><div class="bar" style="background:#35363a;color:#e8eaed"><b style="width:100px">Dark toolbar</b><div class="cell"><div class="row"><img class="x1" src="png/icon-idle-16.png" alt=""><img class="x2" src="png/icon-idle-32.png" alt=""></div>Not a Meet tab</div><div class="cell"><div class="row"><img class="x1" src="png/icon-ready-16.png" alt=""><img class="x2" src="png/icon-ready-32.png" alt=""></div>Meet tab — ready</div><div class="cell"><div class="row"><img class="x1" src="png/icon-recording-16.png" alt=""><img class="x2" src="png/icon-recording-32.png" alt=""></div>Recording</div></div>
